#cloud-config
# Paste into Cloudzy Startup Scripts & Templates. Replace the SSH placeholder.

write_files:
  - path: /root/yimo-recovery.env
    owner: root:root
    permissions: '0600'
    content: |
      YIMO_REPO_URL=https://github.com/goncalofrankefranco/yimo-graphwar.git
      YIMO_REPO_REF=466452a082a8afa1cc048d5a03151634bd9909c2
      YIMO_SSH_CIDR=REPLACE_WITH_ORGANIZER_CIDR
      YIMO_PUBLIC_IP=172.86.118.184
      YIMO_PUBLIC_HOST=graphwar.yimo-official.org
      YIMO_ENABLE_PRACTICE_ROOMS=1
      YIMO_SWAP_SIZE=512M

runcmd:
  - |
      set -Eeuo pipefail
      mkdir -p /var/log
      exec > >(tee -a /var/log/yimo-cloud-init.log) 2>&1
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl git
      . /root/yimo-recovery.env
      test "$YIMO_REPO_REF" != "REPLACE_WITH_APPROVED_COMMIT"
      rm -rf /opt/yimo-source
      git clone --no-checkout "$YIMO_REPO_URL" /opt/yimo-source
      git -C /opt/yimo-source fetch --depth 1 origin "$YIMO_REPO_REF"
      git -C /opt/yimo-source checkout --detach FETCH_HEAD
      export YIMO_REPO_URL YIMO_REPO_REF YIMO_SSH_CIDR YIMO_PUBLIC_IP YIMO_PUBLIC_HOST
      export YIMO_ENABLE_PRACTICE_ROOMS YIMO_SWAP_SIZE
      bash /opt/yimo-source/deploy/cloudzy/setup-yimo-vps.sh
