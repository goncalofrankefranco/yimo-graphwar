#cloud-config
# Paste this file into Cloudzy Startup Scripts & Templates as Ubuntu user-data.
# Replace the two safety placeholders before saving the template.

write_files:
  - path: /root/yimo-recovery.env
    owner: root:root
    permissions: '0600'
    content: |
      YIMO_REPO_URL=https://github.com/goncalofrankefranco/yimo-graphwar.git
      YIMO_REPO_REF=REPLACE_WITH_APPROVED_COMMIT
      YIMO_SSH_CIDR=REPLACE_WITH_ORGANIZER_CIDR
      YIMO_PUBLIC_IP=
      YIMO_RELEASE_URL=https://github.com/goncalofrankefranco/yimo-graphwar/releases/download/v2.0.0/YIMO-Graphwar-2.0.0-Portable.zip
      YIMO_RELEASE_SHA256=087638A79D946C419903749689A8BC9D4DB75C1DB1733A530C57365E4CC93064
      YIMO_ENABLE_PRACTICE_ROOMS=0
      YIMO_SWAP_SIZE=512M

runcmd:
  - |
      set -Eeuo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl git unzip
      . /root/yimo-recovery.env
      test "$YIMO_REPO_REF" != "REPLACE_WITH_APPROVED_COMMIT"
      test "$YIMO_SSH_CIDR" != "REPLACE_WITH_ORGANIZER_CIDR"
      rm -rf /opt/yimo-source
      git clone --no-checkout "$YIMO_REPO_URL" /opt/yimo-source
      git -C /opt/yimo-source fetch --depth 1 origin "$YIMO_REPO_REF"
      git -C /opt/yimo-source checkout --detach FETCH_HEAD
      export YIMO_REPO_URL YIMO_REPO_REF YIMO_SSH_CIDR YIMO_PUBLIC_IP
      export YIMO_RELEASE_URL YIMO_RELEASE_SHA256 YIMO_ENABLE_PRACTICE_ROOMS YIMO_SWAP_SIZE
      if [[ -f /opt/yimo-source/deploy/cloudzy/setup-yimo-vps.sh ]]; then
        bash /opt/yimo-source/deploy/cloudzy/setup-yimo-vps.sh
      else
        # v2.0.0 predates the wrapper, so keep this template usable with the
        # published source while newer approved revisions use the wrapper.
        bash /opt/yimo-source/deploy/cloudzy/bootstrap-vps.sh
        release_archive="$(mktemp /tmp/yimo-release.XXXXXX.zip)"
        release_stage="$(mktemp -d /tmp/yimo-release.XXXXXX)"
        trap 'rm -f "$release_archive"; rm -rf "$release_stage"' EXIT
        curl --fail --silent --show-error --location "$YIMO_RELEASE_URL" --output "$release_archive"
        echo "$YIMO_RELEASE_SHA256  $release_archive" | sha256sum --check --status -
        unzip -q "$release_archive" -d "$release_stage"
        rm -rf "$release_stage/runtime"
        rm -f "$release_stage/YIMO-Graphwar.exe" "$release_stage/launch-yimo.cmd"
        rm -f "$release_stage/launch-practice-server.cmd" "$release_stage/launch-practice-client.cmd"
        bash /opt/yimo-source/deploy/cloudzy/install-release.sh --release-dir "$release_stage"
      fi
