server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yimo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name graphwar.yimo-official.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yimo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://graphwar.yimo-official.org$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/graphwar.yimo-official.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphwar.yimo-official.org/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name graphwar.yimo-official.org;

    ssl_certificate /etc/letsencrypt/live/graphwar.yimo-official.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphwar.yimo-official.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:yimo_tls:10m;
    ssl_session_timeout 1d;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
