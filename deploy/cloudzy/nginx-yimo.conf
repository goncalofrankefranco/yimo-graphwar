server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yimo-acme;
        auth_basic off;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}
