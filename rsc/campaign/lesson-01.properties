id=lesson-01
title=Axes
instructions=Fire the horizontal curve through the target.
guide=Step 1: In shooter-relative mode, additive constants cancel when the graph is anchored to your soldier.\nStep 2: Any constant therefore produces the same horizontal path.\nStep 3: To change the path, change the slope or another shape term.
hint=Constants do not move a shooter-relative graph; use a slope to change its path.
mode=normal
trajectory=shooter-relative
function=0
objective=Hit the target.
target.x=620
target.y=225
target.radius=10
shapes=
step.1.function=0
step.1.instructions=Fire the given horizontal curve and identify the axes.
step.1.guide=The model function is y=0. A constant draws a horizontal line through the shooter.
step.1.hint=The given constant is already aligned with the target height.
step.1.target.x=620
step.1.target.y=225
step.1.target.radius=10
step.1.shapes=
step.2.function=0.1*x
step.2.instructions=The target moved upward. Recreate the path by adding a small slope.
step.2.guide=Keep the shooter anchor in mind: changing a constant would do nothing, so use m*x to tilt the line.
step.2.hint=Try 0.1*x and compare the target height with the horizontal model.
