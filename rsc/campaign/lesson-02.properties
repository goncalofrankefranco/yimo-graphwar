id=lesson-02
title=Straight lines
instructions=Use a line with a gentle positive slope.
guide=Step 1: Build a line as m*x+b.\nStep 2: Use m to control the slope.\nStep 3: In shooter-relative mode, b cancels, so do not use it as a vertical offset.
hint=Think about slope m; an additive b does not move a shooter-relative path.
mode=normal
trajectory=shooter-relative
function=0.1*x
objective=Reach the raised target.
target.x=620
target.y=178
target.radius=10
shapes=
step.1.function=0.1*x
step.1.instructions=Fire the given gentle positive-slope line.
step.1.guide=Read the model as y=mx+b. The coefficient 0.1 controls the slope; the shooter supplies the vertical placement.
step.1.hint=Start with the given 0.1*x expression.
step.1.target.x=620
step.1.target.y=178
step.1.target.radius=10
step.1.shapes=
step.2.function=0.15*x
step.2.instructions=The target moved to a different height. Recreate the line with a steeper slope.
step.2.guide=Keep the same shooter anchor and increase m; changing b would leave this relative path unchanged.
step.2.hint=Try 0.15*x and use the target height to judge the new slope.
step.2.target.x=620
step.2.target.y=150
step.2.target.radius=10
step.2.shapes=
