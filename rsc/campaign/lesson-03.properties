id=lesson-03
title=Slope control
instructions=Change the slope without losing the line.
guide=Step 1: Keep the line form m*x+b.\nStep 2: Change m to tilt the path.\nStep 3: Remember that b cancels in shooter-relative mode, so it cannot translate the shot.
hint=Change the slope term; do not expect an additive constant to move the path.
mode=normal
trajectory=shooter-relative
function=0.1*x
objective=Use a controlled slope to hit the target.
target.x=620
target.y=178
target.radius=10
shapes=
step.1.function=0.1*x
step.1.instructions=Fire the given line and observe its slope.
step.1.guide=The model is y=0.1*x. The shooter anchor determines the starting point; the slope determines the path.
step.1.hint=The additive constant is irrelevant here; start with the given slope.
step.1.target.x=620
step.1.target.y=178
step.1.target.radius=10
step.1.shapes=
step.2.function=0.15*x
step.2.instructions=The target moved higher. Adapt the slope while preserving the shooter anchor.
step.2.guide=Increase m from 0.1 to 0.15. Do not add a constant expecting it to translate the path.
step.2.hint=Try 0.15*x and compare the new slope with the target height.
step.2.target.x=620
step.2.target.y=150
step.2.target.radius=10
