id=lesson-04
title=Parabolas
instructions=Curve around the open space and avoid the terrain.
guide=Step 1: A parabola can be written a*x^2+b*x+c.\nStep 2: A smaller absolute a makes a wider curve.\nStep 3: Choose the width and offset that pass through the open space beside the block.
hint=Start with a wide parabola, then adjust its constant offset.
mode=normal
trajectory=shooter-relative
function=x^2/100
objective=Hit the target without touching the block.
target.x=620
target.y=226
target.radius=10
shapes=rectangle:360:205:100:35
