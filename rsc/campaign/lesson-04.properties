id=lesson-04
title=Parabolas
instructions=Curve around the open space and avoid the terrain.
guide=Step 1: A parabola can be written a*x^2+b*x+c.\nStep 2: A smaller absolute a makes a wider curve.\nStep 3: Choose the width and offset that pass through the open space beside the block.
hint=Start with a wide parabola, then adjust its constant offset.
mode=normal
trajectory=shooter-relative
function=x^2/100
objective=Hit the target without touching the block.
target.x=620
target.y=226
target.radius=10
shapes=rectangle:360:205:100:35
step.1.function=x^2/100
step.1.instructions=Fire the given wide parabola around the block.
step.1.guide=The positive x^2 coefficient makes a U-shape. A large denominator keeps it wide enough for the gap.
step.1.hint=Start with the given x^2/100 model.
step.1.target.x=620
step.1.target.y=226
step.1.target.radius=10
step.1.shapes=rectangle:360:205:100:35
step.2.function=x^2/110
step.2.instructions=The target moved left. Recreate the parabola and adapt its width.
step.2.guide=Use the same quadratic structure, then increase the denominator to make the curve slightly wider.
step.2.hint=Try x^2/110 and check the clearance beside the block.
step.2.target.x=600
step.2.target.y=226
step.2.target.radius=10
step.2.shapes=rectangle:360:205:100:35
