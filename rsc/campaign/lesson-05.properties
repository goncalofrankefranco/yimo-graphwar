id=lesson-05
title=Trigonometry
instructions=Use a sine curve to find the target.
guide=Step 1: Use the sine function with the syntax sin(x).\nStep 2: Multiply it by a number to change amplitude.\nStep 3: Tune its phase with x; an additive constant does not shift a shooter-relative wave.
hint=Use sin(x), then adjust amplitude or phase rather than expecting a constant to move the path.
mode=normal
trajectory=shooter-relative
function=sin(x)
objective=Hit the target with a periodic curve.
target.x=615
target.y=217
target.radius=10
shapes=circle:400:100:32
step.1.function=sin(x)
step.1.instructions=Fire the given sine wave toward the target.
step.1.guide=sin(x) creates the wave. The shooter-relative engine places its starting point at your soldier.
step.1.hint=Start with the given sin(x) model.
step.1.target.x=615
step.1.target.y=217
step.1.target.radius=10
step.1.shapes=circle:400:100:32
step.2.function=sin(x+0.1)
step.2.instructions=The target moved left. Recreate the wave and adapt its phase.
step.2.guide=Keep the amplitude and add a small value inside the parentheses to shift the wave horizontally.
step.2.hint=Try sin(x+0.1) and keep the wave height unchanged.
step.2.target.x=595
step.2.target.y=217
step.2.target.radius=10
step.2.shapes=circle:400:100:32
