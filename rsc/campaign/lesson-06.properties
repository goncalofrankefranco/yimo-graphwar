id=lesson-06
title=First-order ODE
instructions=Solve the first-order curve from the shooter position.
guide=Step 1: In first-order mode, the expression describes y'.\nStep 2: Use y on the right side to make the slope depend on height.\nStep 3: A negative multiple of y creates a curve that decays toward the axis.
hint=Make the slope depend on y; a negative multiple produces decay.
mode=first-ode
trajectory=shooter-relative
function=-y/5
objective=Follow the solution to the target.
target.x=620
target.y=225
target.radius=10
shapes=rectangle:300:300:130:35
