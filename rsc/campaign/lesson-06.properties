id=lesson-06
title=First-order ODE
instructions=Solve the first-order curve from the shooter position.
guide=Step 1: In first-order mode, the expression describes y'.\nStep 2: Use y on the right side to make the slope depend on height.\nStep 3: A negative multiple of y creates a curve that decays toward the axis.
hint=Make the slope depend on y; a negative multiple produces decay.
mode=first-ode
trajectory=shooter-relative
function=-y/5
objective=Follow the solution to the target.
target.x=620
target.y=225
target.radius=10
shapes=rectangle:300:300:130:35
step.1.function=-y/5
step.1.instructions=Fire the given first-order differential equation.
step.1.guide=In y'=-y/5, the slope depends on height. The negative coefficient makes the solution decay.
step.1.hint=Start with the given -y/5 model.
step.1.target.x=620
step.1.target.y=225
step.1.target.radius=10
step.1.shapes=rectangle:300:300:130:35
step.2.function=-y/6
step.2.instructions=The target moved left. Recreate the decay with a gentler rate.
step.2.guide=Keep the y-dependent structure and change the denominator to reduce the decay rate.
step.2.hint=Try -y/6 and watch how the solution changes.
step.2.target.x=600
step.2.target.y=225
step.2.target.radius=10
step.2.shapes=rectangle:300:300:130:35
