id=lesson-09
title=Custom maps
instructions=Read the map and thread the curve between shapes.
guide=Step 1: Treat each shape as solid terrain.\nStep 2: Identify the empty corridor between the circle and rectangle.\nStep 3: Build the simplest path that stays clear, then adjust its vertical offset.
hint=Use the empty corridor as your target path and keep clearance from both shapes.
mode=normal
trajectory=shooter-relative
function=0
objective=Cross the map without touching either shape.
target.x=620
target.y=225
target.radius=10
shapes=circle:380:120:35;rectangle:450:300:120:35
step.1.function=0
step.1.instructions=Fire the given horizontal path through the custom map corridor.
step.1.guide=The circle and rectangle are solid. Use the model to see the open corridor before firing.
step.1.hint=Start with the given constant path and inspect the clearance.
step.1.target.x=620
step.1.target.y=225
step.1.target.radius=10
step.1.shapes=circle:380:120:35;rectangle:450:300:120:35
