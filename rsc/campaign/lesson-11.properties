id=lesson-11
title=Negative slopes
instructions=Use a negative slope to send the curve downward toward the target.
guide=Step 1: In y=m*x+b, a negative m makes y decrease as x increases.\nStep 2: The shooter-relative anchor supplies the starting height; choose m for the direction.
hint=Try a small negative coefficient such as -0.1*x.
mode=normal
trajectory=shooter-relative
function=-0.1*x
objective=Hit the lower target with a descending line.
target.x=620
target.y=272
target.radius=10
shapes=
step.1.function=-0.1*x
step.1.instructions=Fire the given descending line.
step.1.guide=The negative coefficient changes the slope, so the path falls as it travels right from your soldier.
step.1.hint=Start with -0.1*x and watch the direction of the line.
step.1.target.x=620
step.1.target.y=272
step.1.target.radius=10
step.1.shapes=
step.2.function=-0.15*x
step.2.instructions=The target moved lower. Recreate the line with a steeper negative slope.
step.2.guide=Make m more negative to increase the downward tilt. An added constant still cancels in this mode.
step.2.hint=Try -0.15*x and keep the same shooter anchor.
step.2.target.x=600
step.2.target.y=293
step.2.target.radius=10
step.2.shapes=
