step.2.function=0.35*x
step.2.instructions=The target moved closer. Adapt the line with a slightly steeper slope.
step.2.guide=Increase m from 0.3 to 0.35, then use the shorter horizontal distance to avoid overshooting the ceiling.
step.2.hint=Try 0.35*x and aim at the nearer target.
