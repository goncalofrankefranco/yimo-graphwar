step.1.instructions=Fire the given steep line toward the high target.
step.1.guide=The coefficient 0.3 is the slope. Because the map is finite, a steep line can reach the ceiling quickly.
step.1.hint=Start with 0.3*x and check how much vertical distance it covers.
step.1.target.x=580
step.1.target.y=95
step.1.target.radius=10
