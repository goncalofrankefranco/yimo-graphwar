id=lesson-12
title=Steep lines
instructions=Control a steep positive slope without leaving the map.
guide=Step 1: A larger positive m rises faster as x increases.\nStep 2: Scale the slope so the curve stays inside the 15-unit vertical range.
hint=Use 0.3*x first; reduce the coefficient if the path rises too quickly.
mode=normal
trajectory=shooter-relative
function=0.3*x
objective=Reach the high target with a controlled steep line.
