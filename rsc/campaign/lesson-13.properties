id=lesson-13
title=Cubic curves
instructions=Use an odd-power curve and learn how its slope changes across the map.
guide=Step 1: x^3 keeps the sign of x, unlike x^2.\nStep 2: Divide by a large number to keep the cubic inside the map.\nStep 3: Check the curve near the shooter before firing.
hint=Start with x^3/1000. Increase the denominator to flatten the curve.
mode=normal
trajectory=shooter-relative
function=x^3/1000
objective=Hit the target with a scaled cubic.
target.x=612
target.y=113
target.radius=10
shapes=
step.1.function=x^3/1000
step.1.instructions=Fire the scaled cubic at the right-hand target.
step.1.guide=The cubic bends more strongly as |x| grows. The denominator 1000 keeps that growth playable.
step.1.hint=Use x^3/1000 exactly, with parentheses if you rewrite it.
step.1.target.x=612
step.1.target.y=113
step.1.target.radius=10
step.1.shapes=
step.2.function=x^3/1200
step.2.instructions=The target moved left. Recreate the cubic with a wider, gentler scale.
step.2.guide=Increasing the denominator from 1000 to 1200 reduces the vertical change while preserving the cubic shape.
step.2.hint=Try x^3/1200 and compare the bend with step 1.
step.2.target.x=600
step.2.target.y=144
step.2.target.radius=10
