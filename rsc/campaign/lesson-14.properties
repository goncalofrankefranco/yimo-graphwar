id=lesson-14
title=Absolute value
instructions=Build a V-shaped path using an absolute value.
guide=Step 1: abs(x) removes the sign, so both sides of the graph are non-negative.\nStep 2: Dividing by a number controls the V width.\nStep 3: The cusp at x=0 is part of the shape.
hint=Use abs(x)/3 for a wide V.
mode=normal
trajectory=shooter-relative
function=abs(x)/3
objective=Learn to read and control a V-shaped curve.
target.x=620
target.y=226
target.radius=10
shapes=
step.1.function=abs(x)/3
step.1.instructions=Fire the given V-shaped path.
step.1.guide=On the left of the y-axis, abs(x) behaves like -x; on the right, it behaves like x. The two rays meet at zero.
step.1.hint=Start with abs(x)/3 and observe where the cusp appears.
step.1.target.x=620
step.1.target.y=226
step.1.target.radius=10
step.1.shapes=
step.2.function=abs(x)/2.5
step.2.instructions=The target moved slightly. Recreate the V with a narrower scale.
step.2.guide=Use a smaller denominator to make both arms steeper while keeping the absolute-value structure.
step.2.hint=Try abs(x)/2.5 and compare the arms of the V.
step.2.target.x=600
step.2.target.y=236
step.2.target.radius=10
step.2.shapes=
