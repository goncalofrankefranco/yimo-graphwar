id=lesson-15
title=Square roots
instructions=Use a square root safely when the shooter starts on a negative x-coordinate.
guide=Step 1: sqrt(x) is undefined for negative x.\nStep 2: Wrapping x in abs() gives sqrt(abs(x)), which is valid on both sides.\nStep 3: The root grows slowly, so expect a gentle curve.
hint=Protect the domain with sqrt(abs(x)).
mode=normal
trajectory=shooter-relative
function=sqrt(abs(x))
objective=Reach the target with a valid square-root domain.
target.x=300
target.y=249
target.radius=10
shapes=
step.1.function=sqrt(abs(x))
step.1.instructions=Fire the domain-safe square-root curve.
step.1.guide=Your shooter begins where x is negative. abs(x) makes the input non-negative before sqrt evaluates it.
step.1.hint=Use sqrt(abs(x)); plain sqrt(x) would fail at the shooter.
step.1.target.x=300
step.1.target.y=249
step.1.target.radius=10
step.1.shapes=
step.2.function=1.3*sqrt(abs(x))
step.2.instructions=The target moved right. Recreate the root and adapt its scale.
step.2.guide=Keep abs(x) inside the square root, then multiply the result by 1.3 to make the curve taller.
step.2.hint=Try 1.3*sqrt(abs(x)) and keep the domain safe.
