id=lesson-16
title=Reciprocal curves
instructions=Read the asymptote and use a reciprocal curve on the safe side of it.
guide=Step 1: A reciprocal curve has the form 1/(x-a).\nStep 2: The denominator cannot be zero, so locate the vertical asymptote first.\nStep 3: Keep the shooter and target on a continuous branch.
hint=In 1/(x+20), the asymptote is x=-20, to the left of the shooter.
mode=normal
trajectory=shooter-relative
function=1/(x+20)
objective=Cross one continuous branch without hitting the asymptote.
target.x=300
target.y=227
target.radius=10
shapes=
step.1.function=1/(x+20)
step.1.instructions=Fire the reciprocal curve on the branch to the right of x=-20.
step.1.guide=The denominator is zero at x=-20. Since the shooter starts to the right of that value, the path stays on the safe branch.
step.1.hint=Start with 1/(x+20) and do not cross its asymptote.
step.1.target.x=300
step.1.target.y=227
step.1.target.radius=10
step.1.shapes=
step.2.function=1/(x+18)
step.2.instructions=The target moved. Recreate the reciprocal and move its asymptote closer.
step.2.guide=Changing +20 to +18 moves the asymptote to x=-18. It is still left of the shooter, so the branch remains continuous.
step.2.hint=Try 1/(x+18) and check the denominator at the shooter.
step.2.target.x=320
step.2.target.y=230
step.2.target.radius=10
step.2.shapes=
