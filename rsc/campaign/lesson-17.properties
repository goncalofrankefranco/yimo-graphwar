id=lesson-17
title=Exponential growth
instructions=Use exponential growth and keep it inside the map.
guide=Step 1: exp(x) grows quickly for positive x and decays for negative x.\nStep 2: Dividing x by a scale controls the growth rate.\nStep 3: Choose the scale before choosing a distant target.
hint=Try exp(x/10); the divisor makes the growth playable.
mode=normal
trajectory=shooter-relative
function=exp(x/10)
objective=Use controlled exponential growth to reach the high target.
target.x=620
target.y=157
target.radius=10
shapes=
step.1.function=exp(x/10)
step.1.instructions=Fire the given scaled exponential curve.
step.1.guide=The negative shooter-side x produces a small value, while the positive side grows. The /10 scale prevents an immediate explosion.
step.1.hint=Start with exp(x/10) and watch the growth toward the right.
step.1.target.x=620
step.1.target.y=157
step.1.target.radius=10
step.1.shapes=
step.2.function=exp(x/12)
step.2.instructions=The target moved closer. Recreate the exponential with slower growth.
step.2.guide=Increasing the divisor to 12 reduces the exponent magnitude, making the curve less aggressive.
step.2.hint=Try exp(x/12) and compare its growth rate with step 1.
