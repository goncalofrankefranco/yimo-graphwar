id=lesson-18
title=Logarithms
instructions=Use a logarithm with a valid domain and a slow curve.
guide=Step 1: ln(u) needs u>0.\nStep 2: ln(abs(x)) is defined away from x=0 on both sides.\nStep 3: The logarithm changes quickly near zero and slowly farther away.
hint=Use ln(abs(x)) and avoid the logarithm's undefined point at x=0.
mode=normal
trajectory=shooter-relative
function=ln(abs(x))
objective=Reach the target while respecting the logarithm domain.
target.x=300
target.y=241
target.radius=10
shapes=
step.1.function=ln(abs(x))
step.1.instructions=Fire the domain-safe logarithmic curve.
step.1.guide=abs(x) supplies a positive logarithm input except at x=0. The shooter and target stay on the negative-x branch.
step.1.hint=Start with ln(abs(x)) and stay away from x=0.
step.1.target.x=300
step.1.target.y=241
step.1.target.radius=10
step.1.shapes=
step.2.function=ln(abs(x+2))
step.2.instructions=The target moved right. Recreate the log with a horizontal input shift.
step.2.guide=Adding 2 inside abs() moves the point where the input can become zero. Keep the whole path on a valid branch.
step.2.hint=Try ln(abs(x+2)) and inspect the shifted domain boundary.
