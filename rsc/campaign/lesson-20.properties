id=lesson-20
title=Tangent curves
instructions=Use tangent while respecting its repeating vertical asymptotes.
guide=Step 1: tan(x) has vertical asymptotes where cosine is zero.\nStep 2: Dividing x by a number spreads those asymptotes apart.\nStep 3: Use a safe interval so the shot remains continuous.
hint=Try tan(x/20); its first asymptote is outside this lesson's path.
mode=normal
trajectory=shooter-relative
function=tan(x/20)
objective=Reach the target on a safe tangent branch.
target.x=620
target.y=195
target.radius=10
shapes=
step.1.function=tan(x/20)
step.1.instructions=Fire the scaled tangent curve.
step.1.guide=Scaling x by 20 keeps the shooter-to-target interval away from the nearest tangent asymptote while preserving the S-shape.
step.1.hint=Start with tan(x/20) and watch for discontinuities.
step.1.target.x=620
step.1.target.y=195
step.1.target.radius=10
step.1.shapes=
step.2.function=tan(x/22)
step.2.instructions=The target moved closer. Recreate the tangent with a wider scale.
step.2.guide=Increasing the divisor to 22 spreads the curve further and lowers its rate of change on this interval.
step.2.hint=Try tan(x/22) and keep the shot on one continuous branch.
step.2.target.x=600
step.2.target.y=201
step.2.target.radius=10
