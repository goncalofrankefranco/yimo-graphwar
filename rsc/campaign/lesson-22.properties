id=lesson-22
title=Wave Strength
instructions=Control the wave's strength without changing its line.
guide=The line term is the steady backbone; the sine term is the ripple, and its amplitude controls how tall the wave becomes.
hint=Compare the coefficient in front of sine.
mode=normal
trajectory=shooter-relative
function=0.15*x+2*sin(x/9)
objective=Change wave amplitude while keeping the backbone.
target.x=500
target.y=119
target.radius=14
shapes=
step.1.function=0.15*x+2*sin(x/9)
step.1.instructions=Fire a small sine wave riding on a line.
step.1.guide=The line term is the steady backbone; the sine term is the ripple, and its amplitude controls how tall the wave becomes.
step.1.hint=Compare the coefficient in front of sine.
step.1.target.x=500
step.1.target.y=119
step.1.target.radius=14
step.1.shapes=
step.2.function=0.15*x+5*sin(x/9)
step.2.instructions=The target moved. Keep the same spacing but make the wave taller.
step.2.guide=Keep the line and the input scale x/9; change only the sine amplitude from 2 to 5 to strengthen its peaks and dips.
step.2.hint=Only the number before sin changes.
