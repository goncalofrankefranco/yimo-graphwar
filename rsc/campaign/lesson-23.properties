id=lesson-23
title=Wave Spacing
instructions=Change how quickly the sine wave repeats.
guide=The line term supplies the backbone; the sine term adds repeated bends, and the scale of its input changes the spacing between those bends.
hint=Changing x/7 to x/12 spreads the wave out.
mode=normal
trajectory=shooter-relative
function=0.15*x+3*sin(x/7)
objective=Adapt the spacing of a wave on a steady line.
target.x=500
target.y=94
target.radius=14
shapes=
step.1.function=0.15*x+3*sin(x/7)
step.1.instructions=Fire the closer-spaced sine wave.
step.1.guide=The line term supplies the backbone; the sine term adds repeated bends, and the scale of its input changes the spacing between those bends.
step.1.hint=Changing x/7 to x/12 spreads the wave out.
step.1.target.x=500
step.1.target.y=94
step.1.target.radius=14
step.1.shapes=
step.2.function=0.15*x+3*sin(x/12)
step.2.instructions=The target moved. Recreate the curve with wider wave spacing.
step.2.guide=Keep the line slope and sine amplitude; increase the divisor from 7 to 12 so the input changes more slowly and the wave spacing grows.
step.2.hint=Adjust the divisor inside sine to spread out its cycles.
