step.1.guide=The line term controls the overall climb; cosine adds a repeating ripple that begins at a crest.
step.1.hint=Use cosine for the wave and tune the line coefficient for the trend.
step.1.target.x=500
step.1.target.y=127
step.1.target.radius=14
step.1.shapes=
step.2.function=0.3*x+2*cos(x/8)
step.2.instructions=The target moved. Rebuild the curve with a steeper backbone.
step.2.guide=Keep the cosine ripple unchanged and raise the line coefficient from 0.2 to 0.3; the trend climbs faster while the wave spacing stays put.
