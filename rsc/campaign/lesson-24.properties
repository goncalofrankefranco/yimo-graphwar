id=lesson-24
title=Line + Cosine
instructions=Combine a line with a cosine ripple.
guide=The line term controls the overall climb; cosine adds a repeating ripple that begins at a crest.
hint=Use cosine for the wave and tune the line coefficient for the trend.
mode=normal
trajectory=shooter-relative
function=0.2*x+2*cos(x/8)
objective=Balance a cosine ripple with a linear climb.
target.x=500
target.y=127
target.radius=14
