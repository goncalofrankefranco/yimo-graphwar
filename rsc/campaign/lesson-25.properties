id=lesson-25
title=Quadratic + Wave
instructions=Add a sine ripple to a curved quadratic trend.
guide=The quadratic term creates a bending trend; sine adds smaller repeated waves over that curve.
hint=The squared term controls broad curvature; the sine term adds local ripples.
mode=normal
trajectory=shooter-relative
function=0.04*x^2+0.15*x+2*sin(x/7)
objective=Blend broad quadratic curvature with a wave.
