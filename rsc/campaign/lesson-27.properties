id=lesson-27
title=Exponential + Line
instructions=Use a line to correct the shape of an exponential curve.
guide=The exponential term accelerates as x grows; the line term adds a steady correction across the whole path.
hint=Keep the exponential growth gentle with a divisor inside exp.
mode=normal
trajectory=shooter-relative
function=exp(x/14)+0.15*x
objective=Combine accelerating growth with a controllable linear correction.
target.x=500
target.y=152
target.radius=14
shapes=
step.1.function=exp(x/14)+0.15*x
step.1.instructions=Fire the gentle exponential plus line.
step.1.guide=The exponential term accelerates as x grows; the line term adds a steady correction across the whole path.
step.1.hint=Keep the exponential growth gentle with a divisor inside exp.
step.1.target.x=500
step.1.target.y=152
step.1.target.radius=14
step.1.shapes=
step.2.function=exp(x/14)+0.25*x
step.2.instructions=The target moved. Rebuild the curve with a stronger line correction.
step.2.guide=Leave the exponential scale x/14 unchanged and raise the line coefficient from 0.15 to 0.25; that shifts the trend more as the shot travels.
step.2.hint=Adjust only the coefficient multiplying x.
