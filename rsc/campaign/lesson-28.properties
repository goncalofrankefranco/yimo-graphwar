id=lesson-28
title=Modulated Cosine
instructions=Let x change the size of a cosine wave, then add a line correction.
guide=The x*cos(x/10) term makes cosine's amplitude grow with distance; the line term corrects the overall trend.
hint=Compare x*cos(x/10)/5 with a line added outside the cosine.
mode=normal
trajectory=shooter-relative
function=x*cos(x/10)/5+0.12*x
objective=Understand a wave whose amplitude changes along the path.
